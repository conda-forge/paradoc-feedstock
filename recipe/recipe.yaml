schema_version: 1

context:
  python_min: "3.10"
  name: paradoc
  version: "0.6.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/Krande/paradoc/archive/v${{ version }}.tar.gz
  sha256: 7892bc979d569701c08daeb8531a237173f22589e8e0306721df742a5f8e51ae
  patches:
    - patches/remove_pypandoc_encoding_kwarg.patch

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - paradoc=paradoc.cli_app:app
      - paradoc-serve=paradoc.serve.cli:app
      - paradoc-migrate-syntax=paradoc.cli.migrate_syntax:app

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pandoc
    - pandoc-crossref
    - pypandoc
    - python-docx
    - python-kaleido
    - numpy
    - pandas
    - openpyxl
    - tabulate
    - pydantic
    - svgwrite
    - pytexit
    - websockets
    - plotly
    - typer
    - if: unix
      then: __unix
    - if: win
      then:
        - __win
        - pywin32
tests:
  - files:
      source:
        - tests
        - files
    requirements:
      run:
        - pytest
        - pytest-cov
        - pytest-timeout
        - python ${{ python_min }}.*
        - playwright
        - pytest-playwright
    script:
      # --timeout with the thread method (works on Windows) fails any test that
      # hangs instead of stalling CI, and dumps the hung test's stack trace.
      - if: not win
        then:
          - pytest tests --ignore=tests/frontend --timeout=300 --timeout-method=thread
      - if: win
        then:
          # paradoc's plot tests render Plotly figures via python-kaleido, which
          # drives headless Chrome through choreographer. No browser ships with
          # conda, so provide one before running the suite:
          #   Option A: download Chrome-for-Testing to choreographer's default
          #             path (auto-discovered by the launcher).
          #   Option B (fallback, no network): if the download fails, point
          #             choreographer at the runner's pre-installed Edge.
          - 'kaleido_get_chrome || set "BROWSER_PATH=C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe"'
          - pytest tests --ignore=tests/frontend --timeout=300 --timeout-method=thread

about:
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: A Python library for Parametric Documentation
  homepage: https://github.com/krande/paradoc

extra:
  recipe-maintainers:
    - Krande
