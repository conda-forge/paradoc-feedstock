schema_version: 1

context:
  python_min: "3.10"
  name: paradoc
  version: "0.7.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/Krande/paradoc/archive/v${{ version }}.tar.gz
  sha256: 097e6384bf42aa8990ab52d493e6f086e032519d2705bb914ed87598507595b6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - paradoc=paradoc.cli_app:app
      - paradoc-serve=paradoc.serve.cli:app
      - paradoc-migrate-syntax=paradoc.cli.migrate_syntax:app

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pandoc
    - pandoc-crossref
    - pypandoc
    - python-docx
    - python-kaleido
    - numpy
    - pandas
    - openpyxl
    - tabulate
    - pydantic
    - svgwrite
    - pytexit
    - websockets
    - plotly
    - pillow
    - typer
    - if: unix
      then: __unix
    - if: win
      then:
        - __win
        - pywin32
tests:
  - files:
      source:
        - tests
        - files
      recipe:
        - setup_browser.py
    requirements:
      run:
        - pytest
        - pytest-cov
        - pytest-timeout
        - python ${{ python_min }}.*
        - playwright
        - pytest-playwright
    script:
      # --timeout with the thread method (works on Windows) fails any test that
      # hangs instead of stalling CI, and dumps the hung test's stack trace.
      - if: not win
        then:
          - pytest tests --ignore=tests/frontend --timeout=300 --timeout-method=thread
        else:
          - python setup_browser.py > browser_path.txt
          - set /p BROWSER_PATH=<browser_path.txt
          - pytest tests --ignore=tests/frontend --timeout=300 --timeout-method=thread
about:
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: A Python library for Parametric Documentation
  homepage: https://github.com/krande/paradoc

extra:
  recipe-maintainers:
    - Krande
